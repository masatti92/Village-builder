<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');

:root{
  --bg: #1c2a1f;
  --bg-alt: #24352a;
  --parchment: #efe6d3;
  --parchment-dark: #ded0ac;
  --wood: #8b5e34;
  --wood-dark: #5f3f22;
  --ink: #2b2118;
  --p1: #c8622a;
  --p2: #3e6e8e;
  --gold: #d4a937;
  --bad: #7a2e2e;
  --good: #3e6e46;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{overflow-x:hidden; width:100%;}
html,body{margin:0;padding:0;}
body{
  overflow-x:hidden;
  background:
    radial-gradient(circle at 20% 10%, rgba(212,169,55,0.07), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(62,110,142,0.08), transparent 40%),
    var(--bg);
  min-height:100vh;
  font-family:'Zen Kaku Gothic New', sans-serif;
  color:var(--parchment);
  padding:14px 12px 40px;
  transition: background 0.8s ease;
}
body.season-0{
  background:
    radial-gradient(circle at 20% 10%, rgba(255,182,213,0.16), transparent 45%),
    radial-gradient(circle at 80% 90%, rgba(150,220,150,0.13), transparent 45%),
    #203323;
}
body.season-1{
  background:
    radial-gradient(circle at 20% 10%, rgba(255,221,110,0.18), transparent 45%),
    radial-gradient(circle at 80% 90%, rgba(110,190,255,0.14), transparent 45%),
    #1d3320;
}
body.season-2{
  background:
    radial-gradient(circle at 20% 10%, rgba(255,140,60,0.18), transparent 45%),
    radial-gradient(circle at 80% 90%, rgba(150,90,40,0.14), transparent 45%),
    #2a2015;
}
body.season-3{
  background:
    radial-gradient(circle at 20% 10%, rgba(190,225,255,0.18), transparent 45%),
    radial-gradient(circle at 80% 90%, rgba(255,255,255,0.10), transparent 45%),
    #182430;
}
.season-particles{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0;}
.season-particles span{position:absolute; top:-30px; font-size:20px; opacity:.32; animation:driftDown linear infinite;}
@keyframes driftDown{0%{transform:translateY(-30px) translateX(0) rotate(0deg);} 100%{transform:translateY(115vh) translateX(24px) rotate(80deg);}}
#app{max-width:420px; margin:0 auto; position:relative; z-index:1;}

.board-flank-row{display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:center; gap:6px; margin-bottom:8px; width:100%; max-width:100%;}
.board-center{flex:1 1 100%; order:3; min-width:0; max-width:100%;}
.play-controls{max-width:460px; margin:0 auto;}
.cpu-thinking{
  text-align:center; font-size:14px; font-weight:700; color:var(--parchment); padding:14px;
  background:rgba(212,169,55,.16); border:1px dashed rgba(212,169,55,.4); border-radius:10px; margin-bottom:10px;
  animation:cpuPulse 1.4s ease-in-out infinite;
}
@keyframes cpuPulse{0%,100%{opacity:1;} 50%{opacity:.55;}}
.cpu-thinking.decided{animation:none; opacity:1; background:rgba(107,196,120,.18); border-color:rgba(107,196,120,.4);}
.board-flank-row .player-card{flex:1 1 47%; min-width:0; max-width:48%; padding:9px 7px; order:1; overflow:hidden;}
.board-flank-row .player-card:nth-of-type(2){order:2;}
.board-flank-row .player-card .pname{font-size:14px; gap:4px; flex-wrap:wrap; min-width:0;}
.board-flank-row .player-card .prof-chip{font-size:11px; padding:2px 5px;}
.board-flank-row .player-card .prof-short{font-size:11px; margin-top:4px; line-height:1.4;}
.board-flank-row .player-card .monument-badge{font-size:9.5px; padding:1px 6px; margin-top:4px;}
.board-flank-row .player-card .pts{font-size:20px; margin-top:5px;}
.board-flank-row .player-card .res-row{font-size:13px; gap:5px; margin-top:6px; flex-wrap:wrap; min-width:0;}
.board-flank-row .player-card .res-row span{white-space:nowrap;}
.now-turn-badge{white-space:normal;}

@media (min-width:820px){
  body{padding:18px 24px;}
  #app{max-width:460px;}
  #app[data-phase="playing"]{max-width:1160px;}
  .board-flank-row{gap:26px; flex-wrap:nowrap;}
  .board-center{flex:1; order:2;}
  .board-flank-row .player-card{flex:0 0 250px; width:250px; max-width:250px; padding:16px 17px; order:1;}
  .board-flank-row .player-card:nth-of-type(2){order:3;}
  .board-flank-row .player-card .pname{font-size:19px; gap:6px;}
  .board-flank-row .player-card .prof-chip{font-size:13px; padding:2px 7px;}
  .board-flank-row .player-card .prof-short{font-size:13px; margin-top:5px; line-height:1.5;}
  .board-flank-row .player-card .monument-badge{font-size:11px; padding:2px 8px;}
  .board-flank-row .player-card .pts{font-size:30px; margin-top:6px;}
  .board-flank-row .player-card .res-row{font-size:19px; gap:9px; margin-top:8px;}
  .board-wrap{max-width:560px;}
}
h1,.display{font-family:'Zen Maru Gothic', sans-serif;}

function addGoldTiles(n){
  const candidates = [];
  for(let i=0;i<BOARD_SIZE;i++){
    if(!state.board[i] && !state.specialTiles[i]) candidates.push(i);
  }
  for(let i=candidates.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
  }
  const chosen = candidates.slice(0, n);
  chosen.forEach(idx => { state.specialTiles[idx] = 'gold'; });
  return chosen;
}
function addRockTiles(n){
  const candidates = [];
  for(let i=0;i<BOARD_SIZE;i++){
    if(!state.board[i] && !state.specialTiles[i]) candidates.push(i);
  }
  for(let i=candidates.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
  }
  const chosen = candidates.slice(0, n);
  chosen.forEach(idx => { state.specialTiles[idx] = 'rock'; });
  return chosen;
}
function decideEarthquakeRelocations(){
  const results = [];
  for(let pIdx=0; pIdx<2; pIdx++){
    const owned = [];
    state.board.forEach((c,i)=>{ if(c && c.player===pIdx) owned.push(i); });
    for(let i=owned.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [owned[i], owned[j]] = [owned[j], owned[i]];
    }
    const toMove = owned.slice(0, 2);
    const usedTargets = new Set();
    toMove.forEach(fromIdx=>{
      const cell = state.board[fromIdx];
      if(!cell) return;
      const beforeBonus = liveAdjacencyBonus(fromIdx);
      const candidates = neighborIndices(fromIdx).filter(i =>
        !state.board[i] && state.specialTiles[i]!=='rock' && !usedTargets.has(i) && !toMove.includes(i)
      );
      if(candidates.length===0) return;
      const toIdx = candidates[Math.floor(Math.random()*candidates.length)];
      usedTargets.add(toIdx);
      results.push({playerIdx:pIdx, building:cell.building, isProduction:cell.isProduction, fromIdx, toIdx, beforeBonus});
    });
  }
  return results;
}
function applyEarthquakeRelocations(list){
  list.forEach(r=>{
    const cell = state.board[r.fromIdx];
    state.board[r.fromIdx] = null;
    state.board[r.toIdx] = cell;
  });
  list.forEach(r=>{
    r.afterBonus = liveAdjacencyBonus(r.toIdx);
  });
}
function runQuakeAnimation(relocations){
  const flyers = relocations.map(r=>{
    const srcEl = document.getElementById('cell-'+r.fromIdx);
    const tgtEl = document.getElementById('cell-'+r.toIdx);
    if(!srcEl || !tgtEl) return null;
    const emoji = r.isProduction ? PRODUCTION_BUILDINGS[r.building].emoji : POINT_BUILDINGS[r.building].emoji;
    const srcRect = srcEl.getBoundingClientRect();
    const tgtRect = tgtEl.getBoundingClientRect();
    const sx = srcRect.left + srcRect.width/2 - 16;
    const sy = srcRect.top + srcRect.height/2 - 16;
    const tx = tgtRect.left + tgtRect.width/2 - 16;
    const ty = tgtRect.top + tgtRect.height/2 - 16;
    const el = document.createElement('div');
    el.className = 'quake-flyer';
    el.textContent = emoji;
    el.style.left = sx+'px';
    el.style.top = sy+'px';
    document.body.appendChild(el);
    if(srcEl.classList) srcEl.classList.add('quake-shake-source');
    return {el, sx, sy, tx, ty};
  }).filter(Boolean);

  if(flyers.length===0){
    finishQuake(relocations);
    return;
  }

  const duration = 1000;
  const start = performance.now();
  function step(now){
    const t = Math.min(1, (now-start)/duration);
    const ease = t<1 ? 1-Math.pow(1-t,2) : 1;
    const shakeAmp = (1-t) * 9;
    flyers.forEach(f=>{
      const dx = (f.tx-f.sx)*ease + Math.sin(t*32)*shakeAmp;
      const dy = (f.ty-f.sy)*ease + Math.cos(t*27)*shakeAmp*0.6;
      const rot = Math.sin(t*40) * (1-t) * 22;
      f.el.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg)`;
    });
    if(t<1){
      requestAnimationFrame(step);
    } else {
      flyers.forEach(f=>f.el.remove());
      finishQuake(relocations);
    }
  }
  requestAnimationFrame(step);
}
function finishQuake(relocations){

  state.quakeAnimating = false;
  state.pendingQuakeRelocations = null;
  state.eventModalOpen = true;
  render();
}
function typhoonDestroy(){
  const currentIdx = state.current;
  const otherIdx = 1 - currentIdx;
  const ownedCurrent = [];
  const ownedOther = [];
  state.board.forEach((c,i)=>{
    if(c){
      if(c.player===currentIdx) ownedCurrent.push(i);
      else ownedOther.push(i);
    }
  });
  const targets = [];
  if(ownedCurrent.length>0){
    targets.push(ownedCurrent[Math.floor(Math.random()*ownedCurrent.length)]);
  }
  if(ownedOther.length>0){
    targets.push(ownedOther[Math.floor(Math.random()*ownedOther.length)]);
  }
  const remaining = [...ownedCurrent, ...ownedOther].filter(i=>!targets.includes(i));
  if(remaining.length>0){
    targets.push(remaining[Math.floor(Math.random()*remaining.length)]);
  }
  const destroyed = targets.map(idx=>{
    const cell = state.board[idx];
    return {idx, player:cell.player, building:cell.building, isProduction:cell.isProduction};
  });
  destroyed.forEach(d=>{
    removeBuildingAt(d.idx, state.players[d.player]);
  });
  return destroyed;
}

function pickWeightedEvent(){
  const totalWeight = EVENTS.reduce((s,e)=>s+(e.weight!==undefined?e.weight:1), 0);
  let r = Math.random() * totalWeight;
  for(const ev of EVENTS){
    const w = ev.weight!==undefined ? ev.weight : 1;
    if(r < w) return ev;
    r -= w;
  }
  return EVENTS[EVENTS.length-1];
}

function addRandomResource(p, n){
  const delta = {wood:0, stone:0, wheat:0, wool:0};
  for(let i=0;i<n;i++){
    const t = RESOURCE_TYPES[Math.floor(Math.random()*4)];
    p.resources[t] += 1;
    delta[t] += 1;
  }
  return delta;
}
function removeRandomResource(p, n){
  const delta = {wood:0, stone:0, wheat:0, wool:0};
  for(let i=0;i<n;i++){
    const avail = RESOURCE_TYPES.filter(t => p.resources[t] > 0);
    if(avail.length===0) break;
    const t = avail[Math.floor(Math.random()*avail.length)];
    p.resources[t] -= 1;
    delta[t] -= 1;
  }
  return delta;
}
function applyPriestBoost(idx, result){
  const p = state.players[idx];
  if(p.profession !== 'priest') return result;
  const boostedRes = {...result.resources};
  let resourceBoosted = false;
  for(const t of RESOURCE_TYPES){
    if(boostedRes[t] > 0){
      boostedRes[t] += 1;
      p.resources[t] += 1;
      resourceBoosted = true;
      break;
    }
  }
  let boostedPoints = result.points;
  if(!resourceBoosted && result.points > 0){
    boostedPoints += 1;
    p.bonusPoints += 1;
  }
  return {...result, resources:boostedRes, points:boostedPoints};
}
function removeBuildingAt(idx, p){
  const cell = state.board[idx];
  if(!cell) return;
  if(!cell.isProduction) state.buildingSupply[cell.building] += 1;
  state.board[idx] = null;
}
function neighborIndices(idx){
  const row = Math.floor(idx / BOARD_WIDTH), col = idx % BOARD_WIDTH;
  const list = [];
  if(row>0) list.push(idx - BOARD_WIDTH);
  if(row<BOARD_WIDTH-1) list.push(idx + BOARD_WIDTH);
  if(col>0) list.push(idx - 1);
  if(col<BOARD_WIDTH-1) list.push(idx + 1);
  return list;
}
function diagonalIndices(idx){
  const row = Math.floor(idx / BOARD_WIDTH), col = idx % BOARD_WIDTH;
  const list = [];
  if(row>0 && col>0) list.push(idx - BOARD_WIDTH - 1);
  if(row>0 && col<BOARD_WIDTH-1) list.push(idx - BOARD_WIDTH + 1);
  if(row<BOARD_WIDTH-1 && col>0) list.push(idx + BOARD_WIDTH - 1);
  if(row<BOARD_WIDTH-1 && col<BOARD_WIDTH-1) list.push(idx + BOARD_WIDTH + 1);
  return list;
}
function playerHasMonument(playerIdx){
  return state.board.some(c => c && c.player===playerIdx && c.building==='monument');
}
function monumentCellsOf(playerIdx){
  const cells = [];
  state.board.forEach((c,i)=>{ if(c && c.player===playerIdx && c.building==='monument') cells.push(i); });
  return cells;
}
function isNearMonument(idx, playerIdx){
  const monuments = monumentCellsOf(playerIdx);
  if(monuments.length===0) return false;
  return monuments.includes(idx);
}
function countOwnNeighbors(idx, playerIdx){
  let neighbors = neighborIndices(idx);
  if(isNearMonument(idx, playerIdx)) neighbors = neighbors.concat(diagonalIndices(idx));
  return neighbors.filter(n => state.board[n] && state.board[n].player===playerIdx).length;
}
function liveAdjacencyBonus(idx){
  const cell = state.board[idx];
  if(!cell) return 0;
  if(state.specialTiles[idx]==='fog') return 0;
  const p = state.players[cell.player];
  let raw = countOwnNeighbors(idx, cell.player);
  if(cell.isProduction && p.profession==='carpenter' && raw > 0) raw += 1;
  return raw;
}
function cellTotalPoints(idx){
  const cell = state.board[idx];
  if(!cell) return 0;
  return cell.basePts + liveAdjacencyBonus(idx);
}
function recalcPoints(){
  state.players.forEach((p, idx) => {
    let total = p.bonusPoints || 0;
    state.board.forEach((c,i)=>{
      if(c && c.player===idx) total += cellTotalPoints(i);
    });
    p.points = total;
  });
}

const FOG_TILE_COUNT = 3;
function generateSpecialTiles(){
  const indices = Array.from({length:BOARD_SIZE}, (_,i)=>i);
  for(let i=indices.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  const tiles = {};
  indices.slice(0, GOLD_TILE_COUNT).forEach(i => tiles[i] = 'gold');
  indices.slice(GOLD_TILE_COUNT, GOLD_TILE_COUNT + FOG_TILE_COUNT).forEach(i => tiles[i] = 'fog');
  return tiles;
}

function applyDiscount(cost, forcedType){
  const c = {...cost};
  const keys = Object.keys(c).filter(k => c[k] > 0);
  if(keys.length===0) return c;
  const pick = (forcedType && c[forcedType] > 0) ? forcedType : keys[0];
  c[pick] -= 1;
  if(c[pick]===0) delete c[pick];
  return c;
}
function generateArchitectDiscountMap(){
  const map = {};
  for(const key in POINT_BUILDINGS){
    const keys = Object.keys(POINT_BUILDINGS[key].cost);
    map[key] = keys[Math.floor(Math.random()*keys.length)];
  }
  return map;
}
function computeCost(key, isProduction, p){
  const base = isProduction ? PRODUCTION_BUILDINGS[key].cost : POINT_BUILDINGS[key].cost;
  let cost = {...base};
  let discounted = false;
  if(!isProduction && p.profession==='architect'){
    const forcedType = state.architectDiscountMap ? state.architectDiscountMap[key] : null;
    cost = applyDiscount(cost, forcedType); discounted = true;
  }
  return {cost, discounted};
}

function subscribeToRoom(code){
  if(!supabaseClient) return;
  if(realtimeChannel){ try{ supabaseClient.removeChannel(realtimeChannel); }catch(e){} }
  realtimeChannel = supabaseClient
    .channel('room-'+code)
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'rooms', filter:'code=eq.'+code}, (payload)=>{
      handleRemoteRoomUpdate(payload.new.state);
    })
    .subscribe();
}
function handleRemoteRoomUpdate(remote){
  if(!remote) return;
  const asJSON = JSON.stringify(remote);
  if(asJSON === lastPushedStateJSON) return; // echo of our own push, ignore
  if(remote.roomPhase === 'waiting' && state.isHost && state.onlineStep === 'host-waiting'){
    if(remote.guestName && remote.guestProf){
      startOnlineGameAsHost(remote);
    }
    return;
  }
  if(remote.roomPhase === 'playing'){
    applyRemoteGameState(remote);
  }
}
async function startOnlineGameAsHost(remote){
  const winnerIdx = Math.random() < 0.5 ? 0 : 1;
  const names = [remote.hostName, remote.guestName];
  const profs = [remote.hostProf, remote.guestProf];
  const loserIdx = 1 - winnerIdx;
  const savedRoomCode = state.roomCode;
  state = freshState();
  state.onlineMode = true;
  state.isHost = true;
  state.myPlayerIdx = 0;
  state.roomCode = savedRoomCode;
  state.players[0] = newPlayer(names[winnerIdx]);
  state.players[1] = newPlayer(names[loserIdx]);
  const bonusType = RESOURCE_TYPES[Math.floor(Math.random()*RESOURCE_TYPES.length)];
  state.players[1].resources[bonusType] += 1;
  state.players[0].profession = profs[winnerIdx];
  state.players[1].profession = profs[loserIdx];
  state.specialTiles = generateSpecialTiles();
  state.architectDiscountMap = generateArchitectDiscountMap();
  state.phase = 'playing';
  state.current = 0;
  addLog(`${state.players[0].name}(${PROFESSIONS[profs[winnerIdx]].name})と${state.players[1].name}(${PROFESSIONS[profs[loserIdx]].name})の村づくりがはじまった！`);
  addLog(`🔔 ${state.players[0].name}が先行になった！`);
  addLog(`🎁 後攻の${state.players[1].name}は開始ボーナスで ${RES_ICON[bonusType]}+1 をもらった`);
  state.startBonusCelebration = {winnerIdx:0, loserIdx:1, bonusType};
  beginTurn();
  render();
  await pushGameStateNow();
}
function applyRemoteGameState(remote){
  const oldBoard = state.board ? state.board.slice() : [];
  const oldCurrent = state.current;
  const localOnly = {};
  ONLINE_LOCAL_ONLY_KEYS.forEach(k => { localOnly[k] = state[k]; });
  Object.assign(state, remote);
  Object.assign(state, localOnly);
  state.onlineMode = true;
  lastPushedStateJSON = JSON.stringify(getSyncableState());

  // detect what the opponent did by diffing the board, so the other player can see it clearly
  if(state.myPlayerIdx!==null && oldBoard.length===state.board.length){
    let newBuildIdx = -1;
    for(let i=0;i<state.board.length;i++){

function pickCpuBuildCell(playerIdx, avoidFog){
  const monumentCells = monumentCellsOf(playerIdx);
  function monumentClusterBonus(i){
    if(monumentCells.length===0) return 0;
    const neighborhood = [...neighborIndices(i), ...diagonalIndices(i)];
    return monumentCells.some(m => neighborhood.includes(m)) ? 3 : 0;
  }
  let bestIdx = -1;
  let bestIsGold = false;
  let bestNotFog = false;
  let bestAdjacency = -1;
  for(let i=0;i<BOARD_SIZE;i++){
    if(state.board[i]) continue;
    if(state.specialTiles[i]==='rock') continue;
    const isGold = state.specialTiles[i]==='gold';
    const isFog = state.specialTiles[i]==='fog';
    const notFog = !isFog;
    const adjacency = countOwnNeighbors(i, playerIdx) + monumentClusterBonus(i);
    // tier 1: gold tiles always beat non-gold tiles, no matter the adjacency
    if(isGold && !bestIsGold){
      bestIdx = i; bestIsGold = true; bestNotFog = notFog; bestAdjacency = adjacency;
      continue;
    }
    if(!isGold && bestIsGold) continue;
    if(avoidFog){
      // tier 2: within the same gold-status tier, avoid fog when a non-fog option exists
      if(notFog && !bestNotFog){
        bestIdx = i; bestIsGold = isGold; bestNotFog = true; bestAdjacency = adjacency;
        continue;
      }
      if(!notFog && bestNotFog) continue;
    }
    // tier 3: higher adjacency wins (includes a bonus for clustering near own monuments)
    if(adjacency > bestAdjacency){
      bestIdx = i; bestIsGold = isGold; bestNotFog = notFog; bestAdjacency = adjacency;
    }
  }
  return bestIdx;
}
function pickCpuBuildCellForMonument(playerIdx){
  // monument itself benefits from diagonal counting too, so favor cells with existing diagonal neighbors
  let bestIdx = -1;
  let bestIsGold = false;
  let bestScore = -1;
  for(let i=0;i<BOARD_SIZE;i++){
    if(state.board[i]) continue;
    if(state.specialTiles[i]==='rock') continue;
    const isGold = state.specialTiles[i]==='gold';
    const ortho = neighborIndices(i).filter(n => state.board[n] && state.board[n].player===playerIdx).length;
    const diag = diagonalIndices(i).filter(n => state.board[n] && state.board[n].player===playerIdx).length;
    const score = ortho + diag;
    if(isGold && !bestIsGold){ bestIdx = i; bestIsGold = true; bestScore = score; continue; }
    if(!isGold && bestIsGold) continue;
    if(score > bestScore){ bestIdx = i; bestIsGold = isGold; bestScore = score; }
  }
  return bestIdx;
}
function pickCpuBuildCellForFort(playerIdx, enemyIdx){
  // fort steals resources based on adjacent enemy buildings, so favor cells next to the opponent
  let bestIdx = -1;
  let bestEnemyAdj = -1;
  for(let i=0;i<BOARD_SIZE;i++){
    if(state.board[i]) continue;
    if(state.specialTiles[i]==='rock') continue;
    const enemyAdj = neighborIndices(i).filter(n => state.board[n] && state.board[n].player===enemyIdx).length;
    if(enemyAdj > bestEnemyAdj){ bestIdx = i; bestEnemyAdj = enemyAdj; }
  }
  if(bestEnemyAdj > 0) return bestIdx;
  return pickCpuBuildCell(playerIdx, true); // no enemy neighbors available, fall back to normal placement
}
function findCpuExchangeTarget(p){
  const allBuildings = [];
  for(const key in POINT_BUILDINGS){
    if(state.buildingSupply[key] <= 0) continue;
    allBuildings.push({cost: POINT_BUILDINGS[key].cost, priority: POINT_BUILDINGS[key].points + (state.buildingSupply[key]<=2 ? 5 : 0)});
  }
  for(const key in PRODUCTION_BUILDINGS){
    allBuildings.push({cost: PRODUCTION_BUILDINGS[key].cost, priority: 1});
  }
  let best = null;
  let canAlreadyBuildSomething = false;
  for(const b of allBuildings){
    let deficit = 0;
    let neededType = null;
    for(const t of RESOURCE_TYPES){
      const need = (b.cost[t]||0) - p.resources[t];
      if(need > 0){
        deficit += need;
        if(!neededType || need > (b.cost[neededType]||0) - p.resources[neededType]) neededType = t;
      }
    }
    if(deficit === 0){ canAlreadyBuildSomething = true; continue; }
    if(deficit > 1) continue; // only chase targets exactly 1 resource away (reachable via a single 3-for-1 exchange)
    if(!neededType) continue;
    if(!best || b.priority > best.priority) best = {receiveType: neededType, priority: b.priority, cost: b.cost};
  }
  if(!best){
    if(canAlreadyBuildSomething) return null; // no need to exchange, something is already affordable right now
    const sorted = [...RESOURCE_TYPES].sort((a,b)=>p.resources[b]-p.resources[a]);
    const giveType = sorted[0];
    const receiveType = sorted[sorted.length-1];
    if(p.resources[giveType] >= 3 && giveType !== receiveType){
      return {giveType, receiveType};
    }
    return null;
  }
  const giveCandidates = [...RESOURCE_TYPES]
    .filter(t => t !== best.receiveType && p.resources[t] >= 3)
    .sort((a,b) => p.resources[b]-p.resources[a]);
  if(giveCandidates.length===0) return null;
  return {giveType: giveCandidates[0], receiveType: best.receiveType};
}
function runCpuTurn(){
  if(!state.vsComputer || state.cpuPlayerIdx===null || state.current!==state.cpuPlayerIdx || state.phase!=='playing') return;
  if(isAnyModalOpen()){ setTimeout(runCpuTurn, 500); return; }
  const cpuIdx = state.cpuPlayerIdx;
  const p = state.players[cpuIdx];
  state.cpuActionText = null;
  const exchangesDone = [];

  // exchange phase first, so a merchant CPU can use both of its exchanges to set up a build
  while(state.exchangeCount < exchangeLimit(p)){
    const target = findCpuExchangeTarget(p);
    if(!target) break;
    state.exchangeGiveSelected = {wood:0, stone:0, wheat:0, wool:0};
    state.exchangeGiveSelected[target.giveType] = 3;
    pickReceive(target.receiveType);
    exchangesDone.push(target);
  }

  if(exchangesDone.length>0){
    const last = exchangesDone[exchangesDone.length-1];
    const countNote = exchangesDone.length>1 ? `(${exchangesDone.length}回)` : '';
    state.cpuActionText = `🔄 ${RES_ICON[last.giveType]}3個を${RES_ICON[last.receiveType]}1個に交換しました${countNote}`;
    render();
    setTimeout(()=>continueCpuTurnAfterExchange(cpuIdx, exchangesDone), 1300);
  } else {
    continueCpuTurnAfterExchange(cpuIdx, exchangesDone);
  }
}
function continueCpuTurnAfterExchange(cpuIdx, exchangesDone){
  const p = state.players[cpuIdx];
  let buildDecision = null; // {key, isProduction, cellIdx, emoji, name}
  if(!state.actionUsed){
    const humanIdx = 1 - cpuIdx;
    const economyThreshold = state.cpuStrategy==='economy' ? 4 : 3;
    const ownedProductionCount = state.board.filter(c => c && c.player===cpuIdx && c.isProduction).length;
    const turnsRemaining = MAX_TURNS - p.turnsPlayed;
    const totalResources = RESOURCE_TYPES.reduce((s,t) => s + p.resources[t], 0);
    const runningDry = totalResources < 3 && ownedProductionCount < 4 && turnsRemaining > 2;
    const needsEconomy = (ownedProductionCount < economyThreshold && turnsRemaining > 3) || runningDry;

    function pickFromTop(list){
      if(list.length===0) return null;
      const top = list.slice(0, Math.min(3, list.length));
      return top[Math.floor(Math.random()*top.length)];
    }

    function tryPointBuildings(){
      const candidates = [];
      const seasonTurn = p.turnsPlayed % TURNS_PER_SEASON;
      const taxComingSoon = seasonTurn === TURNS_PER_SEASON - 1; // about to hit a tax boundary
      for(const key in POINT_BUILDINGS){
        const supply = state.buildingSupply[key];
        if(supply <= 0) continue;
        const {cost} = computeCost(key, false, p);
        const affordable = Object.keys(cost).every(t => p.resources[t] >= cost[t]);
        if(affordable){
          let scarceBonus = supply <= 2 ? 5 : 0;
          if(supply <= 2){
            const humanOwnsThis = state.board.some(c => c && c.player===humanIdx && !c.isProduction && c.building===key);
            if(humanOwnsThis) scarceBonus += 6; // react: opponent already grabbed one, hurry for the rest
          }
          let strategicBonus = (key==='bank' || key==='fort') ? 3 : 0;
          if(key==='bank' && taxComingSoon) strategicBonus += 6; // build the bank right before tax hits
          const totalAfterPurchase = RESOURCE_TYPES.reduce((s,t) => s + p.resources[t] - (cost[t]||0), 0);
          const wouldDeplete = totalAfterPurchase < 2 && ownedProductionCount < 3 && turnsRemaining > 1;
          if(wouldDeplete) continue; // safety: don't leave the CPU with nothing to work with before it has income
          const taxReserveNeeded = (taxComingSoon && key!=='bank' && ownedProductionCount < 2) ? TAX_AMOUNT : 0;
          if(totalAfterPurchase < taxReserveNeeded) continue; // safety: keep enough to cover next turn's tax
          candidates.push({key, priority: POINT_BUILDINGS[key].points + scarceBonus + strategicBonus});
        }
      }
      candidates.sort((a,b)=>b.priority-a.priority);
      const chosen = pickFromTop(candidates);
      if(chosen){
        const key = chosen.key;
        let cellIdx;
        if(key==='monument') cellIdx = pickCpuBuildCellForMonument(cpuIdx);
        else if(key==='fort') cellIdx = pickCpuBuildCellForFort(cpuIdx, humanIdx);
        else cellIdx = pickCpuBuildCell(cpuIdx, true); // avoid fog for point buildings
        if(cellIdx!==-1){
          return {key, isProduction:false, cellIdx, emoji:POINT_BUILDINGS[key].emoji, name:POINT_BUILDINGS[key].name};
        }
      }
      return null;
    }
    function tryProductionBuildings(){
      const candidates = [];
      for(const key in PRODUCTION_BUILDINGS){
        const {cost} = computeCost(key, true, p);
        const affordable = Object.keys(cost).every(t => p.resources[t] >= cost[t]);
        if(affordable){
          const outputCount = Object.keys(PRODUCTION_BUILDINGS[key].produces).length;
          candidates.push({key, priority: outputCount});
        }
      }
      candidates.sort((a,b)=>b.priority-a.priority);
      const chosen = pickFromTop(candidates);
      if(chosen){
        const cellIdx = pickCpuBuildCell(cpuIdx);
        if(cellIdx!==-1){
          return {key:chosen.key, isProduction:true, cellIdx, emoji:PRODUCTION_BUILDINGS[chosen.key].emoji, name:PRODUCTION_BUILDINGS[chosen.key].name};
        }
      }
      return null;
    }

    if(needsEconomy){
      buildDecision = tryProductionBuildings() || tryPointBuildings();
    } else {
      buildDecision = tryPointBuildings() || tryProductionBuildings();
    }
  }

  if(buildDecision){
    state.current = cpuIdx;
    animateAndPlaceCpu(cpuIdx, buildDecision.cellIdx, buildDecision.emoji, ()=>{
      state.current = cpuIdx;
      state.selectedBuild = {key:buildDecision.key, isProduction:buildDecision.isProduction};
      placeBuilding(buildDecision.cellIdx);
      state.cpuActionText = `🏗️ ${buildDecision.emoji}${buildDecision.name}を建てました！`;
      render();
      finishCpuTurn();
    });
    return;
  }

  if(exchangesDone.length===0){
    state.cpuActionText = `🤔 今回は何もせず、ターンを終了します`;
  }
  render();
  finishCpuTurn();
}

  setTimeout(()=>{
    handleEndTurnClick();

    state.cpuActionText = null;

function setMode(m){

  const p = state.players[state.current];
  if(m==='exchange' && state.exchangeCount >= exchangeLimit(p)) return;
  if(m==='build' && state.actionUsed) return;
  state.mode = (state.mode===m) ? 'idle' : m;

// ---------- exchange ----------
function exchangeRate(p){ return 3; }
function exchangeLimit(p){ return p.profession==='merchant' ? 2 : 1; }

function pickGive(type){
  const p = state.players[state.current];
  if(state.exchangeCount >= exchangeLimit(p)) return;
  const rate = exchangeRate(p);
  const totalSelected = RESOURCE_TYPES.reduce((s,t)=>s+state.exchangeGiveSelected[t],0);
  if(totalSelected >= rate) return;
  if(state.exchangeGiveSelected[type] >= p.resources[type]) return;
  state.exchangeGiveSelected[type] += 1;
  render();
}
function resetExchangeSelection(){
  state.exchangeGiveSelected = {wood:0, stone:0, wheat:0, wool:0};
  render();
}
function pickReceive(type){
  const p = state.players[state.current];
  const rate = exchangeRate(p);
  const totalSelected = RESOURCE_TYPES.reduce((s,t)=>s+state.exchangeGiveSelected[t],0);
  if(totalSelected < rate || state.exchangeCount >= exchangeLimit(p)) return;
  if(state.exchangeGiveSelected[type] === totalSelected) return; // block pointless same-type-in/out trade
  RESOURCE_TYPES.forEach(t => { p.resources[t] -= state.exchangeGiveSelected[t]; });
  p.resources[type] += 1;
  syncDisplayResources(state.current);
  const givenParts = RESOURCE_TYPES.filter(t=>state.exchangeGiveSelected[t]>0).map(t=>`${RES_ICON[t]}${state.exchangeGiveSelected[t]}`).join('+');
  state.exchangeCount += 1;
  state.exchangeGiveSelected = {wood:0, stone:0, wheat:0, wool:0};
  if(state.exchangeCount >= exchangeLimit(p)) state.mode = 'idle';
  addLog(`${p.name}が交換で ${givenParts}→${RES_ICON[type]}1個`);
  render();
}

// ---------- build ----------
function selectBuild(key, isProduction){
  if(state.phase!=='playing' || state.actionUsed) return;
  const p = state.players[state.current];
  if(!isProduction && state.buildingSupply[key] <= 0) return;
  const {cost} = computeCost(key, isProduction, p);
  if(!canAffordCost(p, cost)) return;
  const same = state.selectedBuild && state.selectedBuild.key===key && state.selectedBuild.isProduction===isProduction;
  state.selectedBuild = same ? null : {key, isProduction};
  render();
}

  const startLeft = srcRect.left + srcRect.width/2 - 16;

  flyer.style.left = startLeft + 'px';
  flyer.style.top = startTop + 'px';
  document.body.appendChild(flyer);

      const dy = (tgtRect.top + tgtRect.height/2 - 16) - startTop;
      flyer.style.transform = `translate(${dx}px, ${dy}px) scale(1.4) rotate(-14deg)`;
      flyer.style.opacity = '0.9';

  const flyer = document.createElement('div');
  flyer.className = 'flying-icon';
  flyer.textContent = emoji;
  const startLeft = srcRect.left + srcRect.width/2 - 16;
  const startTop = srcRect.top + srcRect.height/2 - 16;
  flyer.style.left = startLeft + 'px';
  flyer.style.top = startTop + 'px';
  document.body.appendChild(flyer);
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      const dx = (tgtRect.left + tgtRect.width/2 - 16) - startLeft;
      const dy = (tgtRect.top + tgtRect.height/2 - 16) - startTop;
      flyer.style.transform = `translate(${dx}px, ${dy}px) scale(1.4) rotate(14deg)`;
      flyer.style.opacity = '0.9';
    });
  });
  setTimeout(()=>{
    flyer.remove();
    placeBuilding(idx);
  }, 800);
}
function placeBuilding(idx){
  if(state.phase!=='playing' || !state.selectedBuild || state.actionUsed) return;
  if(state.board[idx]) return;
  if(state.specialTiles[idx]==='rock') return;
  const p = state.players[state.current];
  const {key, isProduction} = state.selectedBuild;
  const {cost} = computeCost(key, isProduction, p);
  if(!canAffordCost(p, cost)) return;
  if(!isProduction && state.buildingSupply[key] <= 0) return;

  Object.keys(cost).forEach(k => p.resources[k] -= cost[k]);
  syncDisplayResources(state.current);

  const tile = state.specialTiles[idx];
  const rawAdjacency = (tile==='fog') ? 0 : countOwnNeighbors(idx, state.current);
  const adjacency = (isProduction && p.profession==='carpenter' && rawAdjacency > 0) ? rawAdjacency + 1 : rawAdjacency;
  let basePts;
  if(isProduction){
    basePts = PRODUCTION_BASE_POINTS;
  } else {
    basePts = POINT_BUILDINGS[key].points + (p.profession==='lord' ? 1 : 0);
  }
  const totalPts = basePts + adjacency;

  state.board[idx] = {player: state.current, building:key, isProduction, basePts: basePts};

  let goldNote = '';
  if(tile==='gold'){
    const bonusAmount = (p.profession==='explorer') ? 2 : 1;
    const bonus = addRandomResource(p, bonusAmount);
    const bonusParts = RESOURCE_TYPES.filter(t=>bonus[t]>0).map(t=>`${RES_ICON[t]}+${bonus[t]}`).join(' ');
    goldNote = `、✨金鉱ボーナス${bonusParts}`;
    const b = isProduction ? PRODUCTION_BUILDINGS[key] : POINT_BUILDINGS[key];
    state.goldBonusCelebration = {playerIdx: state.current, bonus, buildingEmoji: b.emoji, buildingName: b.name, location: cellLabel(idx)};
  }
  let fortNote = '';
  if(!isProduction && key==='fort'){
    const enemyNeighborCount = neighborIndices(idx).filter(n => state.board[n] && state.board[n].player !== state.current).length;
    if(enemyNeighborCount>0){
      const opponent = state.players[1 - state.current];
      const stealAmt = enemyNeighborCount;
      const removed = removeRandomResource(opponent, stealAmt);
      const stolenParts = [];
      for(const t of RESOURCE_TYPES){
        if(removed[t] < 0){
          p.resources[t] += -removed[t];
          stolenParts.push(`${RES_ICON[t]}+${-removed[t]}`);
        }
      }
      if(stolenParts.length){
        fortNote = `、🏹隣接${enemyNeighborCount}件の${opponent.name}から${stolenParts.join(' ')}奪った`;
        state.fortStealCelebration = {playerIdx: state.current, opponentIdx: 1-state.current, stolenDelta: removed, neighborCount: enemyNeighborCount};
      }
    }
  }
  let bankNote = '';
  if(!isProduction && key==='bank'){
    p.taxDiscount = 2;
    bankNote = '、🏦次の税金が2個軽減される';
  }
  const adjNote = adjacency>0 ? `、隣接ボーナス+${adjacency}` : '';
  const fogNote = (tile==='fog') ? '、🌫️霧で隣接ボーナスなし' : '';
  if(isProduction){
    addLog(`${p.name}が ${PRODUCTION_BUILDINGS[key].emoji}${PRODUCTION_BUILDINGS[key].name} を建てた（+${totalPts}pt${adjNote}${goldNote}${fogNote}）`);
  } else {
    state.buildingSupply[key] -= 1;
    addLog(`${p.name}が ${POINT_BUILDINGS[key].emoji}${POINT_BUILDINGS[key].name} を建てた（+${totalPts}pt${adjNote}${goldNote}${fogNote}${fortNote}${bankNote}）${state.buildingSupply[key]===0?' ※完売！':''}`);
    if(key==='castle'){
      state.castleCelebration = {player: state.current, points: totalPts};
    }
    if(key==='monument'){
      state.monumentCelebration = {playerIdx: state.current};
    }
    if(state.buildingSupply[key]===0){
      state.soldOutCelebration = {buildingKey:key, buildingName:POINT_BUILDINGS[key].name, emoji:POINT_BUILDINGS[key].emoji};
    }
  }
  state.actionUsed = true;
  state.selectedBuild = null;
  state.mode = 'idle';
  state.lastPlacedIdx = idx;
  render();
}

// ---------- production & tax ----------
function runAutoProduction(playerIdx){
  const p = state.players[playerIdx];
  const gains = {wood:0, stone:0, wheat:0, wool:0};
  state.board.forEach(cell=>{
    if(cell && cell.player===playerIdx && cell.isProduction){
      const b = PRODUCTION_BUILDINGS[cell.building];
      for(const k in b.produces) gains[k] += b.produces[k];
    }
  });
  for(const k in gains) p.resources[k] += gains[k];
  const parts = RESOURCE_TYPES.filter(t=>gains[t]>0).map(t=>`${RES_ICON[t]}+${gains[t]}`);
  addLog(`${p.name}の生産: ${parts.length ? parts.join(' ') : 'なし'}`);
  return gains;
}

function startTaxFlow(){
  state.taxQueue = [0,1];
  state.taxResults = [];
  processNextTaxPlayer();
}
function processNextTaxPlayer(){
  if(state.taxQueue.length===0){
    state.taxCelebration = {results: state.taxResults, seasonIdx: state.pendingTaxSeasonIdx};
    state.taxResults = [];
    render();
    return;
  }
  const playerIdx = state.taxQueue.shift();
  const p = state.players[playerIdx];
  const discount = p.taxDiscount || 0;
  p.taxDiscount = 0;
  const dueAmount = Math.max(0, TAX_AMOUNT - discount);
  const total = RESOURCE_TYPES.reduce((s,t)=>s+p.resources[t],0);
  if(dueAmount===0){
    addLog(`🏦 ${p.name}は銀行のおかげで税金が全額軽減された！`);
    state.taxResults.push({type:'paid', playerIdx, paid:{wood:0,stone:0,wheat:0,wool:0}, discount});
    processNextTaxPlayer();
  } else if(total < dueAmount){
    const owned = [];
    state.board.forEach((c,i)=>{ if(c && c.player===playerIdx) owned.push(i); });
    if(owned.length>0){
      const idx = owned[Math.floor(Math.random()*owned.length)];
      const cell = state.board[idx];
      const b = cell.isProduction ? PRODUCTION_BUILDINGS[cell.building] : POINT_BUILDINGS[cell.building];
      const lostPts = cellTotalPoints(idx);
      removeBuildingAt(idx, p);
      addLog(`💥 ${p.name}は税金(${dueAmount}個)を払えず、${b.emoji}${b.name}（${cellLabel(idx)}）が壊された（-${lostPts}pt）`);
      state.taxResults.push({type:'destroyed', playerIdx, buildingEmoji:b.emoji, buildingName:b.name, location:cellLabel(idx), lostPts});
    } else {
      addLog(`💸 ${p.name}は税金を払えなかった（壊す建物もなかった）`);
      state.taxResults.push({type:'nothing', playerIdx});
    }
    processNextTaxPlayer();
  } else if(p.turnsPlayed >= MAX_TURNS){
    const removed = removeRandomResource(p, dueAmount);
    const paid = {};
    RESOURCE_TYPES.forEach(t => { paid[t] = -removed[t]; });
    const paidParts = RESOURCE_TYPES.filter(t=>paid[t]>0).map(t=>`${RES_ICON[t]}-${paid[t]}`).join(' ');
    const discountNote = discount>0 ? `（🏦銀行で${discount}個軽減）` : '';
    addLog(`💰 ${p.name}は最後の税金として ${paidParts} を納めた${discountNote}`);
    state.taxResults.push({type:'paid', playerIdx, paid, discount});
    processNextTaxPlayer();
  } else if(state.vsComputer && playerIdx===state.cpuPlayerIdx){
    const paid = autoPayCpuTax(p, dueAmount);
    const paidParts = RESOURCE_TYPES.filter(t=>paid[t]>0).map(t=>`${RES_ICON[t]}-${paid[t]}`).join(' ');
    const discountNote = discount>0 ? `（🏦銀行で${discount}個軽減）` : '';
    addLog(`💰 ${p.name}は税金として ${paidParts} を納めた${discountNote}`);
    state.taxResults.push({type:'paid', playerIdx, paid, discount});
    processNextTaxPlayer();
  } else {
    state.taxPaymentUI = {playerIdx, dueAmount, discount, selected:{wood:0,stone:0,wheat:0,wool:0}};
    render();
  }
}
function autoPayCpuTax(p, dueAmount){
  const paid = {wood:0, stone:0, wheat:0, wool:0};
  let remaining = dueAmount;
  const sorted = [...RESOURCE_TYPES].sort((a,b)=>p.resources[b]-p.resources[a]);
  for(const t of sorted){
    if(remaining<=0) break;
    const take = Math.min(p.resources[t], remaining);
    paid[t] = take;
    p.resources[t] -= take;
    remaining -= take;
  }
  return paid;
}
function pickTaxResource(type){
  const ui = state.taxPaymentUI;
  if(!ui) return;
  const p = state.players[ui.playerIdx];
  const totalSelected = RESOURCE_TYPES.reduce((s,t)=>s+ui.selected[t],0);
  if(totalSelected >= ui.dueAmount) return;
  if(ui.selected[type] >= p.resources[type]) return;
  ui.selected[type] += 1;
  render();
}
function resetTaxSelection(){
  const ui = state.taxPaymentUI;
  if(!ui) return;
  ui.selected = {wood:0, stone:0, wheat:0, wool:0};
  render();
}
function confirmTaxPayment(){
  const ui = state.taxPaymentUI;
  if(!ui) return;
  const totalSelected = RESOURCE_TYPES.reduce((s,t)=>s+ui.selected[t],0);
  if(totalSelected < ui.dueAmount) return;
  const p = state.players[ui.playerIdx];
  RESOURCE_TYPES.forEach(t => { p.resources[t] -= ui.selected[t]; });
  const paidParts = RESOURCE_TYPES.filter(t=>ui.selected[t]>0).map(t=>`${RES_ICON[t]}-${ui.selected[t]}`).join(' ');
  const discountNote = ui.discount>0 ? `（🏦銀行で${ui.discount}個軽減）` : '';
  addLog(`💰 ${p.name}は税金として ${paidParts} を納めた${discountNote}`);
  state.taxResults.push({type:'paid', playerIdx: ui.playerIdx, paid:{...ui.selected}, discount: ui.discount});
  state.taxPaymentUI = null;
  processNextTaxPlayer();
}

function endTurn(){
  if(state.phase!=='playing') return;
  const p = state.players[state.current];
  const other = state.players[1-state.current];
  const producingPlayerIdx = state.current;
  const gains = runAutoProduction(state.current);
  state.roundProduction[producingPlayerIdx] = {playerIdx: producingPlayerIdx, gains};
  if(state.roundProduction[0] && state.roundProduction[1]){
    const bothZero = [0,1].every(i => !RESOURCE_TYPES.some(t => state.roundProduction[i].gains[t] > 0));
    if(!bothZero){
      state.productionCelebration = {results:[state.roundProduction[0], state.roundProduction[1]]};
    }
    state.roundProduction = [null, null];
  }
  p.turnsPlayed += 1;
  if(p.turnsPlayed % TURNS_PER_SEASON === 0 && other.turnsPlayed % TURNS_PER_SEASON === 0){
    addLog(`🍂 季節の終わり！税金の時間だよ`);
    state.pendingTaxSeasonIdx = Math.min(3, Math.floor(p.turnsPlayed / TURNS_PER_SEASON) - 1);
    state.pendingTurnSwitch = {finishedPlayerIdx: state.current};
    if(state.productionCelebration){
      state.taxFlowPending = true;
    } else {
      startTaxFlow();
    }
    render();
    return;
  }
  if(p.turnsPlayed>=MAX_TURNS && other.turnsPlayed>=MAX_TURNS){
    state.phase = 'finished';
    render();
    return;
  }
  state.current = 1-state.current;
  beginTurn();
  render();
}

function sharedSeasonBaseIdx(){
  const m = Math.min(state.players[0].turnsPlayed, state.players[1].turnsPlayed);
  return Math.min(3, Math.floor(m / TURNS_PER_SEASON));
}

function renderScoreCard(idx){
  const p = state.players[idx];
  const active = state.phase==='playing' && state.current===idx;
  const seasonIdx = sharedSeasonBaseIdx();
  const turnInSeason = p.turnsPlayed - seasonIdx*TURNS_PER_SEASON;
  const turnDisplay = Math.min(turnInSeason+1, TURNS_PER_SEASON);
  const hasMonument = playerHasMonument(idx);
  return `
    <div class="player-card ${active?'active':''}" id="player-card-${idx}">
      <div class="pname"><span class="dot" style="background:${PLAYER_COLOR[idx]}"></span>${p.name}<span class="prof-chip" onclick="showProfInfo(${idx})">${PROFESSIONS[p.profession].emoji}${PROFESSIONS[p.profession].name}</span></div>
      <div class="prof-short">${PROFESSIONS[p.profession].short}</div>
      ${hasMonument ? `<div class="monument-badge">🗿 記念碑だけ斜め隣接ON</div>` : ''}
      <div class="pts">${p.points}<span style="font-size:10px;">pt</span></div>
      <div class="res-row">
        <span class="mini-label-inline">資源</span>
        <span>🌲${p.displayResources.wood}</span><span>🪨${p.displayResources.stone}</span><span>🌾${p.displayResources.wheat}</span><span>🐏${p.displayResources.wool}</span>
      </div>
      <div class="res-row">
        <span class="mini-label-inline">ターン</span>
        <span>${SEASONS[seasonIdx].emoji}${SEASONS[seasonIdx].name} ${turnDisplay}/3</span>
      </div>
      ${active ? `<div class="now-turn-badge">👉 今の番</div>` : ''}
    </div>
  `;
}

function renderBoard(){
  const canBuild = state.mode==='build' && state.selectedBuild !== null && !state.actionUsed;
  let cells = '';
  for(let i=0;i<BOARD_SIZE;i++){
    const c = state.board[i];
    const tile = state.specialTiles[i];
    const badge = tile==='gold' ? '<span class="tile-badge gold">✨</span>' : tile==='fog' ? '<span class="tile-badge fog">🌫️</span>' : '';
    if(c){
      const b = c.isProduction ? PRODUCTION_BUILDINGS[c.building] : POINT_BUILDINGS[c.building];
      const castleClass = (c.building==='castle') ? 'building-castle' : '';
      const liveAdj = liveAdjacencyBonus(i);
      const livePts = cellTotalPoints(i);
      const adjBadge = liveAdj>0 ? `<span class="adj-badge">+${liveAdj}</span>` : '';
      const buildPop = (state.lastPlacedIdx===i) ? `<span class="onomatopoeia">ドン！</span>` : '';
      const nameLenClass = b.name.length > 4 ? 'long' : '';
      cells += `<div class="cell pop-in owner${c.player} ${castleClass}" title="+${livePts}pt"><span class="building-emoji">${b.emoji}</span><span class="building-name ${nameLenClass}">${b.name}</span>${adjBadge}${badge}${buildPop}</div>`;
    } else if(tile==='rock'){
      cells += `<div class="cell cell-rock" title="岩でふさがれている"><span class="tile-icon-big">🪨</span><span class="tile-name">岩</span></div>`;
    } else {
      const canBuildHere = canBuild;
      const bigIcon = tile==='gold' ? `<span class="tile-icon-big">✨</span><span class="tile-name">金鉱</span>` : tile==='fog' ? `<span class="tile-name">霧</span>` : '';
      const mark = (canBuildHere && !tile) ? '✦' : '';
      let previewBadge = '';
      if(canBuildHere){
        const p = state.players[state.current];
        const rawAdj = (tile==='fog') ? 0 : countOwnNeighbors(i, state.current);
        const previewAdj = (state.selectedBuild.isProduction && p.profession==='carpenter' && rawAdj > 0) ? rawAdj+1 : rawAdj;
        if(previewAdj>0) previewBadge = `<span class="adj-badge preview">+${previewAdj}</span>`;
      }
      const tileClass = tile==='gold' ? 'gold-tile' : tile==='fog' ? 'fog-tile' : '';
      cells += `<div class="cell ${canBuildHere?'buildable':''} ${tileClass}" id="cell-${i}" onclick="animateAndPlace(${i})">${mark}${bigIcon}${previewBadge}</div>`;
    }
  }
  return `
    <div class="board-wrap">
      <div class="board-legend">
        <span><span class="legend-dot" style="background:${PLAYER_COLOR[0]}"></span>${state.players[0].name}の建物</span>
        <span><span class="legend-dot" style="background:${PLAYER_COLOR[1]}"></span>${state.players[1].name}の建物</span>
      </div>
      <div class="board-legend">
        <span>✨金鉱(建てると資源+1)</span>
        <span>🌫️霧(隣接ボーナスなし)</span>
      </div>
      <div class="board-legend">
        <span><span class="legend-dot" style="background:var(--good)"></span>緑バッジ=隣接ボーナスで獲得したpt</span>
      </div>
      <div class="board">${cells}</div>
    </div>
  `;
}

function renderResPick(type, count, selected, disabled, forReceive, costLabel){
  const cls = `res-pick ${selected?'selected':''} ${disabled?'disabled':''}`;
  const action = forReceive ? `pickReceive('${type}')` : `pickGive('${type}')`;
  return `<div class="${cls}" onclick="${disabled?'':action}">
      <div style="font-size:26px;">${RES_ICON[type]}</div>
      <div class="n">${count}</div>
      <div>${RES_NAME[type]}</div>
      ${costLabel ? `<div style="font-size:10px; color:var(--wood-dark); opacity:.75;">${costLabel}個で交換</div>` : ''}
    </div>`;
}

function renderExchangePanel(){
  const p = state.players[state.current];
  const rate = exchangeRate(p);
  const limit = exchangeLimit(p);
  const totalSelected = RESOURCE_TYPES.reduce((s,t)=>s+state.exchangeGiveSelected[t],0);
  const remaining = rate - totalSelected;
  let html = `<div class="sub-panel">
    <div class="sub-title">🔄 交換（1ターン${state.exchangeCount}/${limit}回まで）</div>
    <div class="hint-text" style="text-align:left; margin-bottom:6px;">好きな組み合わせで資源${rate}個えらぶと、好きな資源1個と交換できるよ</div>
    <div class="hint-text" style="text-align:left; margin-bottom:6px;">① 交換に出す資源を${rate}個えらぶ（あと${remaining}個）↓</div>`;
  html += `<div class="res-pick-row">`;
  RESOURCE_TYPES.forEach(t=>{
    const disabled = remaining<=0 || state.exchangeGiveSelected[t] >= p.resources[t];
    const selBadge = state.exchangeGiveSelected[t]>0 ? `<span class="tax-sel-badge">${state.exchangeGiveSelected[t]}こ選択中</span>` : '';
    html += `<div class="res-pick ${state.exchangeGiveSelected[t]>0?'selected':''} ${disabled?'disabled':''}" onclick="${disabled?'':`pickGive('${t}')`}" style="position:relative;">
      ${selBadge}
      <div style="font-size:26px;">${RES_ICON[t]}</div>
      <div class="n">${p.resources[t]}</div>
      <div>${RES_NAME[t]}</div>
    </div>`;
  });
  html += `</div>`;
  if(totalSelected>0){
    html += `<div style="margin-top:6px;"><button class="wood-btn small" onclick="resetExchangeSelection()">選び直す</button></div>`;
  }
  if(remaining<=0){
    html += `<div class="hint-text" style="text-align:left; margin:10px 0 6px;">② 好きな資源1個に交換する ↓</div><div class="res-pick-row">`;
    RESOURCE_TYPES.forEach(t=>{
      const noOp = state.exchangeGiveSelected[t] === totalSelected;
      html += renderResPick(t, p.resources[t], false, noOp, true);
    });
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

function renderBuildPanel(){
  const p = state.players[state.current];
  const list = state.buildTab==='production' ? PRODUCTION_BUILDINGS : POINT_BUILDINGS;
  let html = `<div class="sub-panel">
    <div class="tab-row">
      <div class="tab-btn ${state.buildTab==='production'?'active':''}" onclick="state.buildTab='production'; render();">🌾 生産系(無制限)</div>
      <div class="tab-btn ${state.buildTab==='point'?'active':''}" onclick="state.buildTab='point'; render();">🏆 得点系(早い者勝ち)</div>
    </div>
    <div class="palette">`;
  for(const key in list){
    const isProduction = state.buildTab==='production';
    const b = list[key];
    const {cost, discounted} = computeCost(key, isProduction, p);
    const supplyOk = isProduction ? true : state.buildingSupply[key] > 0;
    const afford = canAffordCost(p, cost) && supplyOk;
    const selected = state.selectedBuild && state.selectedBuild.key===key && state.selectedBuild.isProduction===isProduction;
    const basePts = isProduction ? PRODUCTION_BASE_POINTS : (b.points + (p.profession==='lord'?1:0));
    html += `<div class="bcard ${selected?'selected':''} ${afford?'':'disabled'}" onclick="selectBuild('${key}', ${isProduction})">
      <div class="emoji" ${selected?'id="selected-build-icon"':''}>${b.emoji}</div>
      <div class="bname">${b.name}</div>
      <div class="line-label cost-label">はらうコスト</div>
      <div class="cost">${costStr(cost)}</div>
      ${isProduction ? `<div class="line-label produce-label">毎ターンもらえる</div><div class="produce">${produceStr(b.produces)}</div>` : ''}
      <div class="badges">
        <span class="pts-badge">${basePts}pt+隣接</span>
        ${!isProduction ? `<span class="supply-badge ${state.buildingSupply[key]===0?'zero':''}">${state.buildingSupply[key]===0?'完売':'残'+state.buildingSupply[key]}</span>` : ''}
        ${discounted ? `<span class="disc-badge">割引</span>` : ''}
        ${b.effectText ? `<span class="effect-badge">⚡特殊</span>` : ''}
      </div>
    </div>`;
  }
  html += `</div>`;
  if(state.selectedBuild){
    const selB = state.selectedBuild.isProduction ? PRODUCTION_BUILDINGS[state.selectedBuild.key] : POINT_BUILDINGS[state.selectedBuild.key];
    if(selB.effectText){
      html += `<div class="hint-text">⚡${selB.name}の効果: ${selB.effectText}</div>`;
    }
    html += `<div class="hint-text">↓ 盤面の空いているマスをタップ。自分の建物のとなりだと+1pt</div>`;
  }
  html += `</div>`;
  return html;
}

function renderFinished(){
  const [a,b] = state.players;
  const maxPts = Math.max(a.points, b.points, 1);
  const winner = a.points===b.points ? null : (a.points>b.points ? a : b);
  let confetti = '';
  for(let i=0;i<14;i++){
    const left = Math.random()*100;
    const delay = Math.random()*0.6;
    const dur = 1.4 + Math.random()*1;
    const emoji = ['🎉','✨','🏆','🌟'][i%4];
    confetti += `<span class="confetti" style="left:${left}%; animation-duration:${dur}s; animation-delay:${delay}s;">${emoji}</span>`;
  }
  return `
    <div class="overlay">
      <div class="modal">
        ${confetti}
        <h2>🏆 一年がおわった！</h2>
        <div class="bar-row">
          <div class="bar-label">${a.name}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(a.points/maxPts)*100}%; background:${PLAYER_COLOR[0]};"></div></div>
          <div class="bar-val">${a.points}</div>
        </div>
        <div class="bar-row">
          <div class="bar-label">${b.name}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(b.points/maxPts)*100}%; background:${PLAYER_COLOR[1]};"></div></div>
          <div class="bar-val">${b.points}</div>

function formatDelta(delta){
  return RESOURCE_TYPES.filter(t=>delta[t]!==0).map(t=>{
    const v = delta[t];
    return `<span class="event-delta-chip">${RES_ICON[t]}${v>0?'+':''}${v}</span>`;
  }).join('');
}

function cellLabel(idx){
  const row = Math.floor(idx / BOARD_WIDTH) + 1;
  const col = (idx % BOARD_WIDTH) + 1;
  return `${row}行${col}列`;
}

        <div style="font-size:13.5px; color:var(--wood-dark); line-height:1.7;">${slide.text}</div>
        <div class="tour-dots">${dots}</div>
        <div style="display:flex; gap:8px; margin-top:10px;">
          ${i>0 ? `<button class="wood-btn" onclick="tourPrev()">← もどる</button>` : `<div style="flex:1;"></div>`}
          <button class="wood-btn gold" style="flex:1;" onclick="tourNext()">${isLast ? '🏘️ はじめる！' : 'つぎへ →'}</button>
        </div>
      </div>
    </div>
  `;
}

function renderTutorial(){
  const active = TUTORIAL_SECTIONS.find(s=>s.key===state.tutorialTab) || TUTORIAL_SECTIONS[0];
  const tabsHtml = TUTORIAL_SECTIONS.map(s=>
    `<div class="tut-tab-btn ${s.key===active.key?'active':''}" onclick="setTutorialTab('${s.key}')">${s.tab}</div>`
  ).join('');
  let bodyHtml;
  if(active.key==='profs'){
    bodyHtml = Object.values(PROFESSIONS).map(pr=>`<div class="tut-prof-row">${pr.emoji} <b>${pr.name}</b>：${pr.long}</div>`).join('');
  } else if(active.key==='prod_buildings'){
    const intro = `<div style="margin-bottom:10px;">数の制限なし、いくつでも建てられる。ターン終了時に自動で資源をくれる。</div>`;
    const rows = Object.values(PRODUCTION_BUILDINGS).map(b=>`
      <div class="tut-prof-row">
        ${b.emoji} <b>${b.name}</b>　1pt+隣接ボーナス<br>
        コスト:${costStr(b.cost)} → 毎ターン ${produceStr(b.produces)}
      </div>
    `).join('');
    bodyHtml = intro + rows;
  } else if(active.key==='point_buildings'){
    const intro = `<div style="margin-bottom:10px;">全体で数が決まってる早い者勝ち。売り切れると相手も建てられない。</div>`;
    const rows = Object.values(POINT_BUILDINGS).map(b=>`
      <div class="tut-prof-row">
        ${b.emoji} <b>${b.name}</b>　${b.points}pt+隣接ボーナス　(全${b.supply}個)<br>
        コスト:${costStr(b.cost)}
        ${b.effectText ? `<br><span class="effect-badge" style="display:inline-block; margin-top:4px;">⚡特殊</span> ${b.effectText}` : ''}
      </div>
    `).join('');
    bodyHtml = intro + rows;
  } else if(active.key==='events'){
    const intro = `<div style="margin-bottom:10px;">毎ターン15%の確率で、両プレイヤーに同じ効果のイベントが起こる。運は絡むけど、両者平等に影響するよ。全${EVENTS.length}種類:</div>`;
    const rows = EVENTS.map(ev=>`
      <div class="tut-prof-row">
        <span class="event-tag ${ev.type}" style="margin-bottom:4px;">${ev.type==='good'?'ラッキー':'注意'}</span><br>
        ${ev.emoji} <b>${ev.name}</b>：${ev.desc}
      </div>
    `).join('');
    bodyHtml = intro + rows;
  } else {
    bodyHtml = active.body;
  }
  const activeIndex = TUTORIAL_SECTIONS.findIndex(s=>s.key===active.key) + 1;
  return `
    <div class="overlay" onclick="if(event.target===this) toggleTutorial();">
      <div class="modal tut-modal">
        <h2 style="text-align:center; margin-bottom:4px;">📖 あそびかた</h2>
        <div class="tut-breadcrumb">${activeIndex} / ${TUTORIAL_SECTIONS.length}　${active.tab}</div>
        <div class="tut-layout">
          <div class="tut-tab-col">${tabsHtml}</div>
          <div class="tut-body">
            <div class="tut-section-title">${active.title}</div>
            <div class="tut-section-body">${bodyHtml}</div>
          </div>
        </div>
        <button class="wood-btn gold wide" style="margin-top:10px;" onclick="toggleTutorial()">とじる</button>
      </div>
    </div>
  `;
}

const SEASON_PARTICLE_EMOJI = ['🌸','☀️','🍂','❄️'];
function renderSeasonParticles(seasonIdx){
  const e = SEASON_PARTICLE_EMOJI[seasonIdx];
  let spans = '';
  for(let i=0;i<8;i++){
    const left = Math.random()*100;
    const dur = 8 + Math.random()*8;
    const delay = Math.random()*8;
    spans += `<span style="left:${left}%; animation-duration:${dur}s; animation-delay:-${delay}s;">${e}</span>`;
  }
  return `<div class="season-particles">${spans}</div>`;
}

function renderCastleModal(){
  const info = state.castleCelebration;
  const p = state.players[info.player];
  let confetti = '';
  for(let i=0;i<20;i++){
    const left = Math.random()*100;
    const delay = Math.random()*0.5;
    const dur = 1.3 + Math.random()*1.1;
    const emoji = ['🎉','✨','👑','🏰','🌟'][i%5];
    confetti += `<span class="confetti" style="left:${left}%; animation-duration:${dur}s; animation-delay:${delay}s;">${emoji}</span>`;
  }
  return `
    <div class="overlay">
      <div class="modal castle-modal">
        ${confetti}
        <div class="modal-onomatopoeia">ドドーン！</div>
        <div class="event-emoji-big" style="font-size:64px;">🏰</div>
        <div class="event-tag good">大建築！</div>
        <h2 style="margin:2px 0 4px;">${p.name}が城を建てた！</h2>
        <div style="font-size:15px; font-weight:900; color:var(--gold); text-shadow:0 1px 0 rgba(0,0,0,.2);">+${info.points}pt</div>
        <button class="wood-btn gold wide" style="margin-top:12px;" onclick="closeCastleModal()">すごい！</button>
      </div>
    </div>
  `;
}

function renderTaxPaymentModal(){
  const ui = state.taxPaymentUI;
  const p = state.players[ui.playerIdx];
  const totalSelected = RESOURCE_TYPES.reduce((s,t)=>s+ui.selected[t],0);
  const remaining = ui.dueAmount - totalSelected;
  const chips = RESOURCE_TYPES.map(t=>{
    const disabled = remaining<=0 || ui.selected[t] >= p.resources[t];
    const selBadge = ui.selected[t]>0 ? `<span class="tax-sel-badge">${ui.selected[t]}こ選択中</span>` : '';
    return `
      <div class="res-pick compact-4 ${ui.selected[t]>0?'selected':''} ${disabled?'disabled':''}" onclick="${disabled?'':`pickTaxResource('${t}')`}" style="position:relative;">
        ${selBadge}
        <div style="font-size:22px;">${RES_ICON[t]}</div>
        <div class="n">${p.resources[t]}</div>
        <div>${RES_NAME[t]}</div>
        <div style="font-size:9px; color:var(--wood-dark); opacity:.75;">持ってる数</div>
      </div>
    `;
  }).join('');
  const discountNote = ui.discount>0 ? `<div style="font-size:11.5px; color:var(--wood-dark); margin-top:4px;">🏦銀行の効果で${ui.discount}個軽減されてるよ</div>` : '';
  return `
    <div class="overlay">
      <div class="modal tax-modal">
        <div class="event-tag tax">徴税</div>
        <h2 style="margin:2px 0 4px;">${p.name}の番</h2>
        <div style="font-size:13px; color:var(--wood-dark); line-height:1.6;">税金として資源を合計<b>${ui.dueAmount}個</b>納めてね。どの資源から出すかは自由に選べるよ。<br>タップするたびに1個ずつ選ばれます（あと${remaining}個）</div>
        ${discountNote}
        <div class="res-pick-row no-wrap" style="justify-content:center; margin-top:10px;">${chips}</div>
        <div style="display:flex; gap:8px; margin-top:12px;">
          <button class="wood-btn" style="flex:1;" onclick="resetTaxSelection()" ${totalSelected===0?'disabled':''}>選び直す</button>
          <button class="wood-btn gold" style="flex:1;" onclick="confirmTaxPayment()" ${remaining>0?'disabled':''}>納める</button>
        </div>
      </div>
    </div>
  `;
}

function renderTaxModal(){
  const info = state.taxCelebration;
  const seasonIdx = Math.max(0, Math.min(3, info.seasonIdx));
  const season = SEASONS[seasonIdx];
  const rows = info.results.map(r=>{
    const p = state.players[r.playerIdx];
    let line = '';
    if(r.type==='paid'){
      const parts = RESOURCE_TYPES.filter(t=>r.paid[t]>0).map(t=>`<span class="event-delta-chip">${RES_ICON[t]}-${r.paid[t]}</span>`).join('');
      const discountChip = r.discount>0 ? `<span class="event-delta-chip">🏦-${r.discount}軽減</span>` : '';
      line = parts + discountChip;
    } else if(r.type==='destroyed'){
      line = `<span class="event-delta-chip">${r.buildingEmoji}${r.buildingName}が壊れた（${r.location}・-${r.lostPts}pt）</span>`;
    } else {
      line = `<span class="event-delta-chip">払えなかった（壊す建物もなし）</span>`;
    }
    return `<div class="event-player-label">${p.name}</div><div class="event-delta-row">${line}</div>`;
  }).join('');
  return `
    <div class="overlay">
      <div class="modal tax-modal">
        <div class="tax-icon-row">
          <span class="event-emoji-big" style="font-size:44px;">${season.emoji}</span>
          <span class="event-emoji-big" style="font-size:44px;">💰</span>
        </div>
        <div class="event-tag tax">季節の終わり・徴税</div>
        <h2 style="margin:2px 0 4px;">${season.name}の税(資源${TAX_AMOUNT}個)</h2>
        <div style="font-size:12.5px; color:var(--wood-dark);">両プレイヤーに一斉に発生！</div>
        ${rows}
        <button class="wood-btn gold wide" style="margin-top:8px;" onclick="closeTaxModal()">わかった！</button>
      </div>
    </div>
  `;
}

function renderProductionModal(){
  const results = state.productionCelebration.results;
  const rows = results.map(r=>{
    const p = state.players[r.playerIdx];
    const parts = RESOURCE_TYPES.filter(t=>r.gains[t]>0).map(t=>`<span class="event-delta-chip">${RES_ICON[t]}+${r.gains[t]}</span>`).join('');
    return `<div class="event-player-label">${p.name}</div><div class="event-delta-row">${parts || '<span class="event-delta-chip">なし</span>'}</div>`;
  }).join('');
  return `
    <div class="overlay">
      <div class="modal event-modal good">
        <div class="event-emoji-big">🌾</div>
        <div class="event-tag good">生産完了</div>
        <h2 style="margin:2px 0 4px;">二人の村が収穫した！</h2>
        ${rows}
        <button class="wood-btn gold wide" style="margin-top:8px;" onclick="closeProductionModal()">わかった！</button>
      </div>
    </div>
  `;
}

function renderProfInfoModal(){
  const p = state.players[state.profInfoOpen];
  const pr = PROFESSIONS[p.profession];
  return `
    <div class="overlay" onclick="if(event.target===this) closeProfInfo();">
      <div class="modal">
        <div class="event-emoji-big">${pr.emoji}</div>
        <h2 style="margin:2px 0 4px;">${p.name}の職業：${pr.name}</h2>
        <div style="font-size:13px; color:var(--ink); line-height:1.6; margin-top:6px;">${pr.long}</div>
        <button class="wood-btn gold wide" style="margin-top:12px;" onclick="closeProfInfo()">とじる</button>
      </div>
    </div>
  `;
}

function renderFortStealModal(){
  const info = state.fortStealCelebration;
  const attacker = state.players[info.playerIdx];
  const victim = state.players[info.opponentIdx];
  const parts = RESOURCE_TYPES.filter(t=>info.stolenDelta[t]<0).map(t=>`<span class="event-delta-chip">${RES_ICON[t]}+${-info.stolenDelta[t]}</span>`).join('');
  return `
    <div class="overlay">
      <div class="modal event-modal bad">
        <div class="modal-onomatopoeia">ズバッ！</div>
        <div class="event-emoji-big">🏹</div>
        <div class="event-tag bad">襲撃！</div>
        <h2 style="margin:2px 0 4px;">${attacker.name}が${victim.name}から奪った！</h2>
        <div style="font-size:12.5px; color:var(--wood-dark);">隣接${info.neighborCount}件ぶんの砦効果</div>
        <div class="event-delta-row">${parts}</div>
        <button class="wood-btn gold wide" style="margin-top:8px;" onclick="closeFortStealModal()">わかった！</button>
      </div>
    </div>
  `;
}

function renderMonumentModal(){
  const info = state.monumentCelebration;
  const p = state.players[info.playerIdx];
  return `
    <div class="overlay">
      <div class="modal event-modal good">
        <div class="event-emoji-big">🗿</div>
        <div class="event-tag good">記念碑完成！</div>
        <h2 style="margin:2px 0 4px;">記念碑に効果！</h2>
        <div style="font-size:13px; color:var(--wood-dark); line-height:1.5;">この記念碑そのものは、隣接ボーナス判定に<b>斜めマスも含まれる</b>ようになるよ。</div>
        <button class="wood-btn gold wide" style="margin-top:10px;" onclick="closeMonumentModal()">わかった！</button>
      </div>
    </div>
  `;
}

function renderSoldOutModal(){
  const info = state.soldOutCelebration;
  return `
    <div class="overlay">
      <div class="modal event-modal bad">
        <div class="event-emoji-big">${info.emoji}</div>
        <div class="event-tag bad">完売！</div>
        <h2 style="margin:2px 0 4px;">${info.buildingName}が完売しました</h2>
        <div style="font-size:13px; color:var(--wood-dark);">もう誰も${info.buildingName}を建てられないよ。</div>
        <button class="wood-btn gold wide" style="margin-top:10px;" onclick="closeSoldOutModal()">わかった！</button>
      </div>
    </div>
  `;
}

function renderEndTurnConfirmModal(){
  return `
    <div class="overlay">
      <div class="modal">
        <div class="event-emoji-big">🏗️</div>
        <h2 style="margin:2px 0 4px;">建築しないで終了しますか？</h2>
        <div style="font-size:13px; color:var(--wood-dark); line-height:1.6;">このターンはまだ建物を建ててないよ。このまま終了してもいい?</div>
        <div style="display:flex; gap:8px; margin-top:12px;">
          <button class="wood-btn" style="flex:1;" onclick="cancelEndTurn()">もどる</button>
          <button class="wood-btn gold" style="flex:1;" onclick="confirmEndTurnAnyway()">このまま終了</button>
        </div>
      </div>
    </div>
  `;
}

function renderStartBonusModal(){
  const info = state.startBonusCelebration;
  const winner = state.players[info.winnerIdx];
  const loser = state.players[info.loserIdx];
  return `
    <div class="overlay">
      <div class="modal event-modal good">
        <div class="event-emoji-big">🎲</div>
        <div class="event-tag good">スタート！</div>
        <h2 style="margin:2px 0 4px;">${winner.name}が先行だよ！</h2>
        <div style="font-size:13px; color:var(--wood-dark); line-height:1.6;">後攻の<b>${loser.name}</b>は、開始ボーナスで</div>
        <div class="event-delta-row"><span class="event-delta-chip">${RES_ICON[info.bonusType]}${RES_NAME[info.bonusType]}+1</span></div>
        <div style="font-size:12px; color:var(--wood-dark); margin-top:4px;">をもらったよ！</div>
        <button class="wood-btn gold wide" style="margin-top:10px;" onclick="closeStartBonusModal()">むらづくりスタート！</button>
      </div>
    </div>
  `;
}

function renderGoldBonusModal(){
  const info = state.goldBonusCelebration;
  const p = state.players[info.playerIdx];
  const parts = RESOURCE_TYPES.filter(t=>info.bonus[t]>0).map(t=>`<span class="event-delta-chip">${RES_ICON[t]}+${info.bonus[t]}</span>`).join('');
  return `
    <div class="overlay">
      <div class="modal event-modal good">
        <div class="modal-onomatopoeia">キラーン✨</div>
        <div class="event-emoji-big">✨</div>
        <div class="event-tag good">金鉱ボーナス！</div>
        <h2 style="margin:2px 0 4px;">${p.name}が金鉱を掘り当てた！</h2>
        <div class="event-delta-row">${parts}</div>
        <button class="wood-btn gold wide" style="margin-top:8px;" onclick="closeGoldBonusModal()">わかった！</button>
      </div>
    </div>
  `;
}

function render(){
  recalcPoints();
  const app = document.getElementById('app');
  app.setAttribute('data-phase', state.phase);
  document.body.style.overflow = '';
  document.documentElement.style.overflow = '';
  let html;
  if(state.phase==='setup') html = renderSetup();
  else if(state.phase==='onlineSetup') html = renderOnlineSetup();
  else if(state.phase==='playing') html = renderPlaying();
  else html = renderFinished();
  if(state.endTurnConfirmOpen) html += renderEndTurnConfirmModal();
  if(state.startBonusCelebration) html += renderStartBonusModal();
  if(state.goldBonusCelebration) html += renderGoldBonusModal();
  if(state.fortStealCelebration) html += renderFortStealModal();
  if(state.monumentCelebration) html += renderMonumentModal();
  if(state.soldOutCelebration) html += renderSoldOutModal();
  if(state.productionCelebration) html += renderProductionModal();
  if(state.taxPaymentUI) html += renderTaxPaymentModal();
  if(state.taxCelebration) html += renderTaxModal();
  if(state.castleCelebration) html += renderCastleModal();
  if(state.eventModalOpen) html += renderEventModal();
  if(state.profInfoOpen!==null) html += renderProfInfoModal();
  if(state.showTutorial) html += renderTutorial();
  if(state.tourOpen) html += renderTourOverlay();

  if(state.phase==='playing'){
    const seasonIdx = sharedSeasonBaseIdx();
    document.body.className = `season-${seasonIdx}`;
    html = renderSeasonParticles(seasonIdx) + html;
  } else {
    document.body.className = '';
  }
  app.innerHTML = html;
  scheduleOnlinePush();
}

render();
</script>
</body>
</html>
